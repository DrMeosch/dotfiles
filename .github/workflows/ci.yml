# Proves the dotfiles really apply on a fresh machine: each job runs the real
# `make` twice. The first run must take the bootstrap path (installs Nix, links
# ~/.dotfiles, first home-manager switch), the second must take the rebuild
# path. Then .github/scripts/smoke-test.sh runs. Neither `make` step puts Nix on
# PATH for the step, which is the "fresh shell" situation the Makefile handles.
#
# Targets covered:
#   ubuntu - ubuntu-latest runner
#   arch   - archlinux container on ubuntu-latest (no systemd, so Nix's daemon
#            is started by hand)
#   wsl    - Ubuntu 24.04 on real WSL2 (kernel "microsoft-standard-WSL2",
#            systemd as PID 1) on windows-latest. GitHub-hosted Windows runners
#            do support WSL2, so no WSL1 fallback is needed. Target: wsl-ubuntu.
# Arch under WSL2 (wsl-arch) is not run on a real WSL2 distro: there is no
# reliable way to install an Arch WSL distro on the Windows runner. Its target
# detection is checked by test-detect-target.sh and its configuration by
# `make check`.
#   windows-font - windows/setup.ps1 on windows-latest: installs the Nerd Font
#            for the user and sets it in a Windows Terminal settings.json
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Target detection
        run: ./.github/scripts/test-detect-target.sh

      - name: Make update
        run: ./.github/scripts/test-make-update.sh

      - name: Make help
        run: make help

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          make YES=1 2>&1 | tee "$RUNNER_TEMP/first.log"
          grep -q 'first run' "$RUNNER_TEMP/first.log"
          grep -q 'target ubuntu' "$RUNNER_TEMP/first.log"

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          make 2>&1 | tee "$RUNNER_TEMP/second.log"
          grep -q 'existing setup found' "$RUNNER_TEMP/second.log"

      - name: Make check
        run: make check

      - name: Smoke test
        run: EXPECT_FONT=1 ./.github/scripts/smoke-test.sh

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm --needed git curl sudo make

      - uses: actions/checkout@v7.0.1

      # Bootstrap needs a regular user (the home directory is /home/<user>).
      - name: Create a regular user
        run: |
          useradd --create-home --shell /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # A container has no systemd, so the Determinate installer sets Nix up
      # without a daemon service. Install it the way bootstrap.sh does, start
      # the daemon by hand, then let bootstrap.sh skip its own Nix step.
      - name: Install Nix and start its daemon
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install --no-confirm
          setsid /nix/var/nix/profiles/default/bin/nix-daemon > /tmp/nix-daemon.log 2>&1 < /dev/null &
          until [ -S /nix/var/nix/daemon-socket/socket ]; do sleep 1; done

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          sudo -iu builder make -C "$GITHUB_WORKSPACE" YES=1 2>&1 | tee /tmp/first.log
          grep -q 'first run' /tmp/first.log
          grep -q 'target arch' /tmp/first.log

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          sudo -iu builder make -C "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/second.log
          grep -q 'existing setup found' /tmp/second.log

      - name: Smoke test
        run: sudo -iu builder env EXPECT_FONT=1 "$GITHUB_WORKSPACE/.github/scripts/smoke-test.sh"

  wsl:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        # wsl-bash is created by Vampire/setup-wsl; it runs the step in the distro.
        shell: wsl-bash {0}
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REPO_SHA: ${{ github.sha }}
      # Pass these through to the WSL side.
      WSLENV: REPO_URL:REPO_SHA
    steps:
      - name: Install Ubuntu 24.04 on WSL2
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl git ca-certificates sudo make

      # Bootstrap needs a regular user (the home directory is /home/<user>). Make
      # it the distro's default user, as on a real install, and restart the
      # distro so the following steps run as that user.
      - name: Create a regular user
        run: |
          useradd --create-home --shell /bin/bash dev
          echo 'dev ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dev
          printf '\n[user]\ndefault=dev\n' >> /etc/wsl.conf

      - name: Restart the distro
        shell: pwsh
        run: wsl --terminate Ubuntu-24.04

      - name: Show the environment
        run: |
          cat /proc/version
          echo "pid 1: $(ps -p 1 -o comm=)"
          id

      # The Windows-side checkout is CRLF on drvfs, so clone inside WSL instead.
      - name: Clone the repo in WSL
        run: |
          git init ~/dotfiles
          git -C ~/dotfiles fetch --depth 1 "$REPO_URL" "$REPO_SHA"
          git -C ~/dotfiles checkout --detach FETCH_HEAD

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          make -C ~/dotfiles YES=1 2>&1 | tee /tmp/first.log
          grep -q 'first run' /tmp/first.log
          grep -q 'target wsl-ubuntu' /tmp/first.log

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          make -C ~/dotfiles 2>&1 | tee /tmp/second.log
          grep -q 'existing setup found' /tmp/second.log

      - name: Smoke test
        run: ~/dotfiles/.github/scripts/smoke-test.sh

  # windows/setup.ps1 is what puts the Nerd Font on the Windows side of WSL.
  # Runs in Windows PowerShell 5.1, the one every Windows has.
  windows-font:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    env:
      FONT_FACE: GeistMono Nerd Font
    steps:
      - uses: actions/checkout@v7.0.1

      # A settings.json like Windows Terminal writes it: comments, a trailing
      # comma, and a WSL profile. It sits in the stable-package location.
      - name: Create a Windows Terminal settings.json
        run: |
          $dir = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          @'
          // Windows Terminal settings (test fixture)
          {
              "defaultProfile": "{ubuntu}",
              "profiles": {
                  "defaults": { "colorScheme": "One Half Dark" },
                  "list": [
                      { "guid": "{ubuntu}", "name": "Ubuntu", "source": "Windows.Terminal.Wsl" },
                      { "guid": "{ps}", "name": "PowerShell", "commandline": "powershell.exe", },
                  ]
              },
          }
          '@ | Set-Content -Path "$dir\settings.json" -Encoding UTF8

      - name: Run windows/setup.ps1
        run: .\windows\setup.ps1

      - name: Run it again (must be a no-op)
        run: .\windows\setup.ps1

      - name: Assert the font and the settings
        run: |
          $ErrorActionPreference = 'Stop'
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          $files = Get-ChildItem $fontDir -Filter 'GeistMonoNerdFont-*.otf'
          if ($files.Count -ne 9) { throw "expected 9 font files in $fontDir, found $($files.Count)" }
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
          foreach ($f in $files) {
              $name = $f.BaseName + ' (OpenType)'
              if ($reg.$name -ne $f.FullName) { throw "$name is not registered for the user" }
          }
          # Windows itself must see the family under the name Windows Terminal is given.
          # FamilyNames is the typographic family (name ID 16); GetFontFamilies and
          # Win32FamilyNames report the legacy "GeistMono NF" (name ID 1) instead.
          Add-Type -AssemblyName PresentationCore
          $regular = Join-Path $fontDir 'GeistMonoNerdFont-Regular.otf'
          $families = (New-Object Windows.Media.GlyphTypeface([Uri]$regular)).FamilyNames.Values
          if (-not ($families -match [regex]::Escape($env:FONT_FACE))) { throw "'$env:FONT_FACE' not found in: $($families -join ', ')" }

          $settingsFile = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json"
          $s = Get-Content $settingsFile -Raw | ConvertFrom-Json
          if ($s.profiles.defaults.font.face -ne $env:FONT_FACE) { throw "profiles.defaults.font.face is not set" }
          if ($s.profiles.defaults.colorScheme -ne 'One Half Dark') { throw "existing settings were lost" }
          if ($s.profiles.list.Count -ne 2) { throw "profile list was damaged" }
          $backups = @(Get-ChildItem (Split-Path $settingsFile) -Filter 'settings.json.bak-*')
          if ($backups.Count -ne 1) { throw "expected exactly 1 backup after two runs, found $($backups.Count)" }
          if ((Get-Content $backups[0].FullName -Raw) -notmatch 'Windows Terminal settings \(test fixture\)') { throw "backup is not the original file" }
          Write-Host "font files, registry, settings.json and backup all check out"
