# Proves the dotfiles really apply on a fresh machine: each job runs the real
# `make` twice. The first run must take the bootstrap path (installs Nix, links
# ~/.dotfiles, first home-manager switch), the second must take the rebuild
# path. Then .github/scripts/smoke-test.sh runs. Neither `make` step puts Nix on
# PATH for the step, which is the "fresh shell" situation the Makefile handles.
#
# Targets covered:
#   ubuntu - ubuntu-latest runner
#   arch   - archlinux container on ubuntu-latest (no systemd, so Nix's daemon
#            is started by hand)
#   wsl    - Ubuntu 24.04 on real WSL2 (kernel "microsoft-standard-WSL2",
#            systemd as PID 1) on windows-latest. GitHub-hosted Windows runners
#            do support WSL2, so no WSL1 fallback is needed. Target: wsl-ubuntu.
# Arch under WSL2 (wsl-arch) is not run on a real WSL2 distro: there is no
# reliable way to install an Arch WSL distro on the Windows runner. Its target
# detection is checked by test-detect-target.sh and its configuration by
# `make check`.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Target detection
        run: ./.github/scripts/test-detect-target.sh

      - name: Make help
        run: make help

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          make YES=1 TARGET=ubuntu 2>&1 | tee "$RUNNER_TEMP/first.log"
          grep -q 'first run' "$RUNNER_TEMP/first.log"

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          make TARGET=ubuntu 2>&1 | tee "$RUNNER_TEMP/second.log"
          grep -q 'existing setup found' "$RUNNER_TEMP/second.log"

      - name: Make check
        run: make check

      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm --needed git curl sudo make

      - uses: actions/checkout@v7.0.1

      # Bootstrap needs a regular user (the home directory is /home/<user>).
      - name: Create a regular user
        run: |
          useradd --create-home --shell /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # A container has no systemd, so the Determinate installer sets Nix up
      # without a daemon service. Install it the way bootstrap.sh does, start
      # the daemon by hand, then let bootstrap.sh skip its own Nix step.
      - name: Install Nix and start its daemon
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install --no-confirm
          setsid /nix/var/nix/profiles/default/bin/nix-daemon > /tmp/nix-daemon.log 2>&1 < /dev/null &
          until [ -S /nix/var/nix/daemon-socket/socket ]; do sleep 1; done

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          sudo -iu builder make -C "$GITHUB_WORKSPACE" YES=1 TARGET=arch 2>&1 | tee /tmp/first.log
          grep -q 'first run' /tmp/first.log

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          sudo -iu builder make -C "$GITHUB_WORKSPACE" TARGET=arch 2>&1 | tee /tmp/second.log
          grep -q 'existing setup found' /tmp/second.log

      - name: Smoke test
        run: sudo -iu builder "$GITHUB_WORKSPACE/.github/scripts/smoke-test.sh"

  wsl:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        # wsl-bash is created by Vampire/setup-wsl; it runs the step in the distro.
        shell: wsl-bash {0}
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REPO_SHA: ${{ github.sha }}
      # Pass these through to the WSL side.
      WSLENV: REPO_URL:REPO_SHA
    steps:
      - name: Install Ubuntu 24.04 on WSL2
        uses: Vampire/setup-wsl@v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl git ca-certificates sudo make

      # Bootstrap needs a regular user (the home directory is /home/<user>). Make
      # it the distro's default user, as on a real install, and restart the
      # distro so the following steps run as that user.
      - name: Create a regular user
        run: |
          useradd --create-home --shell /bin/bash dev
          echo 'dev ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/dev
          printf '\n[user]\ndefault=dev\n' >> /etc/wsl.conf

      - name: Restart the distro
        shell: pwsh
        run: wsl --terminate Ubuntu-24.04

      - name: Show the environment
        run: |
          cat /proc/version
          echo "pid 1: $(ps -p 1 -o comm=)"
          id

      # The Windows-side checkout is CRLF on drvfs, so clone inside WSL instead.
      - name: Clone the repo in WSL
        run: |
          git init ~/dotfiles
          git -C ~/dotfiles fetch --depth 1 "$REPO_URL" "$REPO_SHA"
          git -C ~/dotfiles checkout --detach FETCH_HEAD

      - name: First run (bootstrap path)
        run: |
          set -o pipefail
          make -C ~/dotfiles YES=1 2>&1 | tee /tmp/first.log
          grep -q 'first run' /tmp/first.log
          grep -q 'target wsl-ubuntu' /tmp/first.log

      - name: Second run (rebuild path)
        run: |
          set -o pipefail
          make -C ~/dotfiles 2>&1 | tee /tmp/second.log
          grep -q 'existing setup found' /tmp/second.log

      - name: Smoke test
        run: ~/dotfiles/.github/scripts/smoke-test.sh
