name: probe
on:
  push:
    branches: [fm/dotfiles-ci-ubuntu-wsl]
jobs:
  wsl2:
    runs-on: windows-latest
    steps:
      - name: Environment
        shell: pwsh
        run: |
          systeminfo | Select-String "Hyper-V","Virtualization","OS Name","OS Version"
          Get-ComputerInfo | Select-Object HyperVisorPresent,HyperVRequirementVirtualizationFirmwareEnabled,HyperVRequirementVMMonitorModeExtensions,HyperVRequirementSecondLevelAddressTranslation
          wsl --version
          wsl --status
      - name: Try WSL2 via setup-wsl
        uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
        continue-on-error: true
        id: w2
      - name: Report
        shell: pwsh
        run: |
          "outcome: ${{ steps.w2.outcome }}"
          wsl -l -v
          wsl -d Ubuntu-24.04 -- bash -c 'cat /proc/version; uname -a; id; ps -p 1 -o comm='
        continue-on-error: true
