# Alacritty configuration (Linux: Arch / Ubuntu / WSL2)
# Managed by the dotfiles repo; edit this file in place and it takes effect
# on the next Alacritty launch (no rebuild needed - it is symlinked out of the store).

# Active color theme: current-theme.toml, a copy of one of the files in
# ~/.config/alacritty/themes/ (ours, or the upstream alacritty-theme collection).
# It is untracked state: the `atc` switcher rewrites it, and a rebuild seeds it
# with rose-pine-moon when it does not exist yet. To pick a theme by hand,
# copy one over it. Alacritty only logs a missing import and then runs with its
# built-in default colors.
general.import = ["~/.config/alacritty/current-theme.toml"]

[font]
size = 13.0
# Geist Mono has no italic cut, so there is no italic line: Alacritty falls
# back to the normal family.
normal = { family = "GeistMono Nerd Font", style = "Regular" }
bold = { family = "GeistMono Nerd Font", style = "Bold" }

[window]
# Match the base repo's dimmed, slightly transparent look.
opacity = 0.95
decorations = "none"
dynamic_title = true
padding = { x = 6, y = 6 }
# Spread the sub-cell leftover of a tiling WM-assigned height evenly, so the
# bottom row (tmux status line) sits as low as the grid allows
dynamic_padding = true

[scrolling]
history = 50000
multiplier = 2

[colors]
draw_bold_text_with_bright_colors = true

[bell]
duration = 0

[cursor]
style = { shape = "Block", blinking = "Off" }

# Alacritty does not run a login shell that auto-attaches tmux by default.
# If you want every window to land in tmux, uncomment the block below.
# [terminal.shell]
# program = "zsh"
# args = ["-l", "-c", "tmux attach || tmux new"]
