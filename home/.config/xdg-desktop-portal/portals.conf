# Without this, xdg-desktop-portal on a window manager that sets no
# XDG_CURRENT_DESKTOP has no backend to ask and Settings (the light/dark
# preference browsers follow) goes unanswered. The gtk backend reads GNOME's
# color-scheme gsetting; dwm-dark.sh / dwm-light.sh (from the dwm checkout)
# set it, so they are what change the value the portal reports.
[preferred]
default=gtk
