# The fix for the portal not answering is DISPLAY in the activation environment
# (x11-session-env). This file makes the choice of backend explicit: on a window
# manager that sets no XDG_CURRENT_DESKTOP, xdg-desktop-portal otherwise falls
# back to gtk as a last resort (deprecated, with a warning), and a second
# installed backend could be picked instead. The gtk backend reads GNOME's
# color-scheme gsetting; dwm-dark.sh / dwm-light.sh (from the dwm checkout)
# set it, so they are what change the value the portal reports.
[preferred]
default=gtk
