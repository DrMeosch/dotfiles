set -g prefix C-a
setw -g mode-keys vi
# setw -g mode-style bg=black
set -g history-limit 22222222
unbind-key C-b
bind-key C-a send-prefix
bind-key K clear-history
# setw -g mode-style bg=white
set-option -g default-terminal "tmux-256color"
# set-option -g pane-active-border-style fg=green
set-window-option -g xterm-keys on # for vim
set-window-option -g mode-keys vi # vi key
set-window-option -g monitor-activity on
# set-window-option -g window-status-current-style fg=white
# setw -g window-status-current-style reverse
# setw -g automatic-rename
set -g mouse on
unbind j
unbind C-b # unbind default leader key
unbind '"' # unbind horizontal split
unbind %   # unbind vertical split
# set-option -g status-justify right
# set-option -g status-bg black
bind-key r source-file ~/.tmux.conf

bind-key c split-window -v -c "#{pane_current_path}" # split pane horizontally
# unbind-key -T prefix c
# bind-key -T prefix c split-window -v -c "#{pane_current_path}"

bind-key v split-window -h # split pane vertically
bind-key t new-window
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Scroll 1 line per wheel event (tmux default is 5) so touchpad scrolling is smooth
bind-key -T copy-mode-vi WheelUpPane select-pane \; send -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
bind-key -T copy-mode WheelUpPane select-pane \; send -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send -X -N 1 scroll-down

# Allow the arrow key to be used immediately after changing windows
set-option -g repeat-time 0
bind-key Space list-panes
bind-key Enter break-pane
bind-key J command-prompt "joinp -t:%%" # %% = prompt for window.pane [-V|H] # vert|hor split
bind C-j previous-window
bind C-k next-window
#bind-key C-a last-window # C-a C-a for last active window
bind A command-prompt "rename-window %%"
setw -g aggressive-resize on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# List of plugins
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/tmux-menus'
set -g @plugin 'jaclu/tmux-menus'
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'joshmedeski/tmux-fingers'
# set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# source /usr/lib/python3.7/site-packages/powerline/bindings/tmux/powerline.conf
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default
# Right side: just a 24h HH:MM clock (no date, no timezone, no cpu/ram/battery)
set -g @dracula-plugins "time"
set -g @dracula-time-format "%H:%M"

set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true

source-file -q ~/.tmux/current-theme.conf

# Bootstrap tpm on a fresh machine: clone it, then install and load every
# @plugin above in the background (install_plugins needs a responsive server and
# the plugin path, which tpm itself only sets once it has run).
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm' ; set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/' ; run -b '~/.tmux/plugins/tpm/bin/install_plugins ; ~/.tmux/plugins/tpm/scripts/source_plugins.sh'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# if run as "tmux attach", create a session if one does not already exist
new-session -n $HOST
